plugins{
    id 'java-gradle-plugin'
    id 'groovy'
    id 'java'
    id 'ivy-publish'
    id 'com.gradle.plugin-publish' version '1.3.0'
    id 'nrlssc.gradle' version '5.0.143'
}


compileJava.options.encoding = 'UTF-8'


hgit{
    forceGit = true
}

repositories{
    gradlePluginPortal()
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    api gradleApi()
    implementation localGroovy()
    api 'mil.navy.nrlssc:gplugin-commons:3.0.21'
    api 'mil.navy.nrlssc:appdist-plugin:3.0.44'
    api 'mil.navy.nrlssc:hgit-plugin:3.0.69'
    api 'mil.navy.nrlssc:pub-plugin:3.0.53'
    api 'mil.navy.nrlssc:util-plugin:3.0.26'
    implementation 'gradle.plugin.org.yello-labs:keyring:0.1.0'


    testImplementation gradleTestKit(),
            'junit:junit:4.12'
}

gradlePlugin {
    website = 'https://github.com/nrl-gradle/nrl-plugin'
    vcsUrl = 'https://github.com/nrl-gradle/nrl-plugin.git'
    //noinspection GroovyAssignabilityCheck
    plugins {
        create('nrlPlugin') {
            id = 'nrlssc.gradle'
            tags = ['nrl']
            displayName = 'NRLSSC Enterprise Plugin'
            description = 'Configures boilerplate NRLSSC Enterprise'
            implementationClass = 'nrlssc.gradle.NRLPlugin'

        }
    }
}
